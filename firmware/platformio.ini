[platformio]
default_envs = uno

[env]
monitor_speed = 115200

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<uno.cpp>
lib_deps =
    z3t0/IRremote@^4.4.1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<esp32.cpp>
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
